apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: motomura-io-backendconfig
  namespace: motomura
spec:
  # WebSocket connections are long-lived; 30s default resets Socket.IO.
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 60
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /api/v1/health
    port: 80
  sessionAffinity:
    affinityType: "GENERATED_COOKIE"
    affinityCookieTtlSec: 3600