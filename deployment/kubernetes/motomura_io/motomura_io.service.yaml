apiVersion: "v1"
kind: "Service"
metadata:
  name: "motomura-io"
  namespace: "motomura"
  labels:
    app: "motomura-io"
  annotations:
    # Link the BackendConfig so its 3600s timeout + session affinity actually apply.
    # Without this the GCE LB uses a 30s timeout and resets WebSockets.
    cloud.google.com/backend-config: '{"default": "motomura-io-backendconfig"}'
spec:
  type: ClusterIP
  selector:
    app: "motomura-io"
  ports:
    - name: http
      port: 80
      targetPort: 80