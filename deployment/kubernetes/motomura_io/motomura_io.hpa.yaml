apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: motomura-io-hpa
  namespace: motomura
  labels:
    app: motomura-io-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: motomura-io
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    # - type: Resource
    #   resource:
    #     name: memory
    #     target:
    #       type: Utilization
    #       averageUtilization: 80