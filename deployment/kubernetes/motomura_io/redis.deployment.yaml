apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "redis"
  namespace: "motomura"
  labels:
    app: "redis"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: "redis"
  template:
    metadata:
      labels:
        app: "redis"
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
      containers:
        - name: "redis"
          image: "redis:7-alpine"
          # Require the same password Activepieces sends via AP_REDIS_PASSWORD
          command: ["redis-server"]
          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--appendonly"
            - "yes"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: motomura-app-secret
                  key: AP_REDIS_PASSWORD
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" ping']
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" ping']
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "redis"
  namespace: "motomura"
  labels:
    app: "redis"
spec:
  selector:
    app: "redis"
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
